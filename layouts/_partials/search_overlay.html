<div class="search-overlay" data-search-overlay hidden>
  <div class="search-overlay__backdrop" data-search-close></div>
  <div class="search-overlay__panel" role="dialog" aria-modal="true" aria-label="Search">
    <div class="search-field">
      <span class="search-field__icon" aria-hidden="true">{{ partial "icon.html" "search" }}</span>
      <input class="search-field__input" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search posts" aria-label="Search posts" data-search-input maxlength="80">
      <button class="icon-btn" type="button" data-search-close aria-label="Close search">{{ partial "icon.html" "close" }}</button>
    </div>
    <ul class="search-results" data-search-results></ul>
    <p class="search-hint u-micro" data-search-hint>Type to search · <kbd>esc</kbd> to close</p>
  </div>
</div>
