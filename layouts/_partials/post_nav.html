{{- $prev := .PrevInSection }}{{- $next := .NextInSection }}
{{- if or $prev $next }}
<nav class="post-nav" aria-label="More posts">
  {{- with $next }}
  <a class="post-nav__item" href="{{ .RelPermalink }}">
    <span class="u-micro post-nav__dir">Newer</span>
    <span class="post-nav__title">{{ .Title }}</span>
  </a>
  {{- end }}
  {{- with $prev }}
  <a class="post-nav__item post-nav__item--prev" href="{{ .RelPermalink }}">
    <span class="u-micro post-nav__dir">Older</span>
    <span class="post-nav__title">{{ .Title }}</span>
  </a>
  {{- end }}
</nav>
{{- end }}
