<header class="site-header">
  <div class="site-header__inner wrap">
    <a class="wordmark" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <div class="site-header__rule" aria-hidden="true"></div>

    <nav class="nav" aria-label="Primary">
      <ul class="nav__list u-micro">
        {{- $cur := .RelPermalink }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL | relURL }}"{{ if or (eq $cur (.URL | relURL)) (and (ne (.URL | relURL) "/") (hasPrefix $cur (.URL | relURL))) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
        <li><a href="{{ "/search/" | relURL }}"{{ if eq $cur ("/search/" | relURL) }} aria-current="page"{{ end }} data-search-open>Search</a></li>
      </ul>
    </nav>
  </div>
</header>
