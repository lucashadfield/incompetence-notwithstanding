<header class="site-header">
  <div class="site-header__inner wrap">
    <a class="wordmark" href="{{ "/" | relURL }}">
      <span class="wordmark__mark" aria-hidden="true"></span>
      <span class="wordmark__text">{{ site.Title }}</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <ul class="nav__list u-micro">
        {{- $cur := .RelPermalink }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL | relURL }}"{{ if or (eq $cur (.URL | relURL)) (and (ne (.URL | relURL) "/") (hasPrefix $cur (.URL | relURL))) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>

      <div class="nav__tools">
        <button class="icon-btn" type="button" data-search-open aria-label="Search (press /)">
          {{ partial "icon.html" "search" }}
        </button>
        {{- with site.Home.OutputFormats.Get "rss" }}
        <a class="icon-btn" href="{{ .RelPermalink }}" aria-label="RSS feed">{{ partial "icon.html" "rss" }}</a>
        {{- end }}
        <button class="icon-btn icon-btn--menu" type="button" data-menu-toggle aria-expanded="false" aria-label="Menu">
          {{ partial "icon.html" "menu" }}
        </button>
      </div>
    </nav>
  </div>
  <div class="site-header__rule" aria-hidden="true"></div>
  {{- if .IsPage }}<div class="progress" data-progress aria-hidden="true"></div>{{ end }}
</header>
