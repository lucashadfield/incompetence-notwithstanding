# ── THE ONE LINE TO CHANGE WHEN THE DOMAIN IS UP ────────────────────────────
# Single source of truth. Canonicals, og:url, RSS links, the sitemap and every
# absolute asset URL derive from this; nothing else in the repo hardcodes a
# host. `hugo server` overrides it with --baseURL (see AGENTS.md), and a one-off
# production build can override it too: hugo -b "https://example.com/"
baseURL = "http://lucas-server.axolotl-major.ts.net:1314/"
# ────────────────────────────────────────────────────────────────────────────
locale = 'en-us'
title = 'Incompetence Notwithstanding'
enableRobotsTXT = true
summaryLength = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

# tags only — no empty /categories/ page
[taxonomies]
  tag = "tags"

[params]
  # ── identity ────────────────────────────────────────────────────────────────
  description = "Notes on language models, the things built with them, and what breaks."
  author = "Lucas Hadfield"
  since = 2026
  # homepage statement, set large
  intro = "Writing about wheedling LLMs, mostly"
  # ── behaviour ───────────────────────────────────────────────────────────────
  mainSections = ["posts"]
  dateFormat = "2 Jan 2006"
  showReadingTime = true
  showPostNav = true
  # ── tag display names ───────────────────────────────────────────────────────
  # Hugo title-cases taxonomy terms, which mangles acronyms ("llms" → "Llms").
  # Anything listed here wins; everything else falls back to title-casing.
  # Keys must be the lower-cased tag: Hugo lower-cases TOML keys regardless.
  [params.tagNames]
    llms = "LLMs"
    rl = "RL"
    ml = "ML"
  # ── elsewhere: rendered into /about/ by _partials/social.html ──────────────
  # No brand colours: a cell washes and the mark turns rubric on hover.
  [[params.social]]
    name = "Email"
    url = "mailto:lucas@hadfield.dev"
    icon = "mail"
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/lucashadfield"
    icon = "github"
  [[params.social]]
    name = "LinkedIn"
    url = "https://linkedin.com/in/lucashadfield"
    icon = "linkedin"
  [[params.social]]
    name = "Letterboxd"
    url = "https://letterboxd.com/lhad"
    icon = "letterboxd"
  # ── search (fuse.js) ────────────────────────────────────────────────────────
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.35
    minMatchCharLength = 2
    ignoreLocation = true
    keys = ["title", "summary", "content"]

[markup]
  [markup.highlight]
    noClasses = false
    lineNumbersInTable = false
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true
    hardWraps = true

[menu]
  [[menu.main]]
    name = "Archive"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 30
